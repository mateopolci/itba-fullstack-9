<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Contacto — Mueblería Hermanos Jota."
    >
    <title>Contacto | Hermanos Jota</title>

    <link rel="stylesheet" href="contacto.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo" aria-label="Ir al inicio">
            Hermanos Jota
        </a>

        <nav aria-label="Navegación principal">
            <ul class="nav-list">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <a href="#" class="carrito" aria-label="Carrito de compras">
            🛒 Carrito
            <span id="contador-carrito">0</span>
        </a>
    </header>

    <main>
        <section class="contacto">
            <div class="contacto-intro">
                <p class="eyebrow">Hermanos Jota</p>

                <h1>Contactanos</h1>

                <p>
                    ¿Tenés alguna consulta sobre nuestros muebles?
                    Escribinos y nuestro equipo se pondrá en contacto
                    con vos.
                </p>
            </div>

            <form id="formulario-contacto" novalidate>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Tu nombre"
                        autocomplete="name"
                    >
                    <small id="error-nombre" class="mensaje-error"></small>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                    >
                    <small id="error-email" class="mensaje-error"></small>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="6"
                        placeholder="Escribí tu consulta..."
                    ></textarea>
                    <small id="error-mensaje" class="mensaje-error"></small>
                </div>

                <button type="submit">
                    Enviar mensaje
                </button>

                <div
                    id="mensaje-exito"
                    class="mensaje-exito"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 Mueblería Hermanos Jota.
            Todos los derechos reservados.
        </p>
    </footer>

    <script src="contacto.js"></script>
</body>
</html>
